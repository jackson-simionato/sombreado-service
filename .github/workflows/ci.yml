name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, and build image
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sombreado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sombreado_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sombreado_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create unmigrated readiness database
        run: |
          uv run python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              exists = connection.execute(
                  "SELECT 1 FROM pg_database WHERE datname = 'sombreado_test_unmigrated'"
              ).fetchone()
              if exists is None:
                  connection.execute("CREATE DATABASE sombreado_test_unmigrated")
          PY

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest -q

      - name: Validate Docker image build
        run: docker build -t sombreado-service:${{ github.sha }} .

  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: sombreado-render-deploy
      cancel-in-progress: false
    env:
      # Pipeline Secret: Render Deploy Hook URL (not a Runtime Secret on the web service).
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      ALLOW_SKIP_DEPLOY: ${{ secrets.ALLOW_SKIP_DEPLOY }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Require Render Deploy Hook Pipeline Secret on main
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          if [ "${ALLOW_SKIP_DEPLOY}" = "1" ]; then
            echo "ALLOW_SKIP_DEPLOY=1; skipping Render Deploy Hook."
            exit 0
          fi
          echo "RENDER_DEPLOY_HOOK_URL repository secret is required on main."
          echo "Set it as a Pipeline Secret (Actions), or set ALLOW_SKIP_DEPLOY=1 to opt out explicitly."
          exit 1

      - name: Call Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          # Pin the commit Render should build. Hooks normally include ?key=…;
          # fall back to ?ref= if a bare URL is configured.
          if [[ "${RENDER_DEPLOY_HOOK_URL}" == *\?* ]]; then
            HOOK_URL="${RENDER_DEPLOY_HOOK_URL}&ref=${RELEASE_SHA}"
          else
            HOOK_URL="${RENDER_DEPLOY_HOOK_URL}?ref=${RELEASE_SHA}"
          fi
          curl -fsS --connect-timeout 10 --max-time 30 "${HOOK_URL}"
