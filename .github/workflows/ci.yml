name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, and build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest -q

      - name: Validate Docker image build
        run: docker build -t sombreado-service:${{ github.sha }} .

  deploy:
    name: Deploy release to Oracle VM
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
      VM_PORT: ${{ secrets.VM_PORT }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Skip deployment when VM secrets are not configured
        if: >-
          env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_PRIVATE_KEY == '' ||
          env.VM_SSH_KNOWN_HOSTS == ''
        run: >-
          echo "VM_HOST / VM_USER / VM_SSH_PRIVATE_KEY / VM_SSH_KNOWN_HOSTS
          not configured; skipping VM deployment."

      - name: Check out repository
        if: >-
          env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_PRIVATE_KEY != '' &&
          env.VM_SSH_KNOWN_HOSTS != ''
        uses: actions/checkout@v4

      - name: Configure SSH
        if: >-
          env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_PRIVATE_KEY != '' &&
          env.VM_SSH_KNOWN_HOSTS != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync release tree to VM
        if: >-
          env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_PRIVATE_KEY != '' &&
          env.VM_SSH_KNOWN_HOSTS != ''
        env:
          SSH_OPTS: -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          REMOTE_RELEASE="/opt/sombreado/releases/${RELEASE_SHA}"
          ssh ${SSH_OPTS} -p "${VM_PORT:-22}" "${VM_USER}@${VM_HOST}" "mkdir -p '${REMOTE_RELEASE}'"
          rsync -az --delete \
            -e "ssh ${SSH_OPTS} -p ${VM_PORT:-22}" \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.ruff_cache/' \
            ./ "${VM_USER}@${VM_HOST}:${REMOTE_RELEASE}/"

      - name: Flip symlink and restart API
        if: >-
          env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_PRIVATE_KEY != '' &&
          env.VM_SSH_KNOWN_HOSTS != ''
        env:
          SSH_OPTS: -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          ssh ${SSH_OPTS} -p "${VM_PORT:-22}" "${VM_USER}@${VM_HOST}" \
            "sudo /usr/local/sbin/sombreado-deploy-release '${RELEASE_SHA}'"
