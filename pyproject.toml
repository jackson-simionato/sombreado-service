[project]
name = "sombreado-service"
version = "0.1.0"
description = "Read-only onboard sun advisory backend for Consorcio Fenix route segments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "astral>=3.2",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.60",
    "fastapi>=0.115.0",
    "geoalchemy2>=0.15.0",
    "geographiclib>=2.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
sombreado-scrape = "sombreado.cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sombreado"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
