# Alembic config for the service-owned SQLite Generation Store.
# Prefer: GenerationStore.migrate() / publish-fixture
# CLI: SQLITE_DATABASE_PATH=data/sombreado.sqlite uv run alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Overridden by env.py from SQLITE_DATABASE_PATH when set.
sqlalchemy.url = sqlite:///data/sombreado.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
