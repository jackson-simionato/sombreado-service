# Alembic config for the service-owned Neon/PostGIS Generation Store.
# Prefer: GenerationStore.migrate() / publish-fixture
# CLI: DATABASE_URL=postgresql://... uv run alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Overridden by env.py from DATABASE_URL when set.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/sombreado_test

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
